# CodeQL for the Go exporter.
#
# - Triggers: push to main, pull_request and a weekly schedule. Never
#   pull_request_target.
# - Actions are pinned to full commit SHAs, as in ci.yml.
# - The workflow token is read-only; only the analysis job may write security
#   events (to upload its results).

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 4 * * 1"

permissions:
  contents: read

# A newer push to the same ref replaces a running analysis.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (Go)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # upload the analysis results
    env:
      # Fail rather than silently download a different Go toolchain.
      GOTOOLCHAIN: local
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            uploads.github.com:443
            release-assets.githubusercontent.com:443
            proxy.golang.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: haos_exporter/go.sum

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: go
          build-mode: manual

      - name: Build
        working-directory: haos_exporter
        run: go build ./...

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:go
