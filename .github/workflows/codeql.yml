# CodeQL for the Go exporter.
#
# - Triggers: push to main, pull_request and a weekly schedule. Never
#   pull_request_target.
# - Actions are pinned to full commit SHAs, as in ci.yml.
# - The workflow token is read-only; only the analysis job may write security
#   events (to upload its results).

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (Go)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    env:
      # Fail rather than silently download a different Go toolchain.
      GOTOOLCHAIN: local
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache-dependency-path: haos_exporter/go.sum

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: go
          build-mode: manual

      - name: Build
        working-directory: haos_exporter
        run: go build ./...

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:go
