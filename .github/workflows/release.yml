# Release: on a version tag, publish the app image to GHCR, sign it and
# attest it.
#
# - Trigger: push of a tag vX.Y.Z only. The tag must equal "v" + config.yaml's
#   version and point at a commit on main, or the job stops before building.
# - Tags are immutable: the job stops if the version is already published, and
#   it never pushes a rolling tag such as `latest`. The Supervisor pulls
#   `image:version`, so the image tag is the bare version (0.4.0, not v0.4.0).
# - Each platform is built separately so that BUILD_ARCH (the io.hass.arch
#   label) is right for it; both are pushed by digest and then joined into one
#   multi-arch index under the version tag.
# - The index and both images are signed with cosign keyless (Sigstore, using
#   this job's GitHub OIDC identity). The index gets a SLSA build provenance
#   attestation, and each image an SPDX SBOM attestation, both from GitHub's
#   attest actions.
# - Only this job has write permissions: packages (push to GHCR), id-token
#   (keyless signing and attestations) and attestations. No secret other than
#   the job's own GITHUB_TOKEN is used.
# - Actions are pinned to full commit SHAs, as in ci.yml. cosign itself is
#   pinned by version: cosign-installer checks a bootstrap cosign against a
#   sha256 written into the action, then uses it to verify the requested
#   release's Sigstore signatures before installing it.

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/tbording/haos-exporter

jobs:
  release:
    name: Release (GHCR image, signature, attestations)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push the images and the index to GHCR
      id-token: write # OIDC token for cosign keyless signing and the attestations
      attestations: write # store the provenance and SBOM attestations
    steps:
      # Block mode: the job may reach only these endpoints. They are the ones
      # the v0.4.0 release reached in audit mode (StepSecurity insights for run
      # 37581640422), and the build's share of them matches the CI image job
      # over 15 runs. GitHub Actions' own endpoints (OIDC tokens, cache,
      # artifacts) are allowed implicitly by the agent. A new tool or base
      # image needs its endpoint added here.
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudfront.docker.com:443
            gcr.io:443
            proxy.golang.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        id: meta
        run: |
          version="$(sed -n 's/^version: "\(.*\)"$/\1/p' haos_exporter/config.yaml | head -n 1)"
          test -n "$version"
          if [ "$GITHUB_REF_NAME" != "v${version}" ]; then
            echo "tag $GITHUB_REF_NAME does not match config.yaml version $version" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $GITHUB_REF_NAME does not point at a commit on main" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d-%H:%M:%S)" >> "$GITHUB_OUTPUT"

      # The same digest-pinned BuildKit as ci.yml.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stop if this version is already published
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "${IMAGE}:${VERSION} already exists; published versions are never replaced" >&2
            exit 1
          fi

      - name: Build and push amd64 (by digest)
        id: amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: haos_exporter
          platforms: linux/amd64
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BUILD_ARCH=amd64
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            BUILD_REVISION=${{ github.sha }}
            BUILD_BRANCH=${{ github.ref_name }}
            BUILD_DATE=${{ steps.meta.outputs.date }}

      - name: Build and push arm64 (by digest)
        id: arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: haos_exporter
          platforms: linux/arm64
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BUILD_ARCH=aarch64
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            BUILD_REVISION=${{ github.sha }}
            BUILD_BRANCH=${{ github.ref_name }}
            BUILD_DATE=${{ steps.meta.outputs.date }}

      - name: Join both into the version's multi-arch index
        id: index
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          AMD64: ${{ steps.amd64.outputs.digest }}
          ARM64: ${{ steps.arm64.outputs.digest }}
        run: |
          docker buildx imagetools create -t "${IMAGE}:${VERSION}" "${IMAGE}@${AMD64}" "${IMAGE}@${ARM64}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
          case "$digest" in sha256:*) ;; *) echo "no index digest" >&2; exit 1 ;; esac
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign the index and both images (keyless, by digest)
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes --recursive "${IMAGE}@${DIGEST}"

      - name: Attest build provenance (SLSA) for the index
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
          # Storage records exist only for organization-owned repositories.
          create-storage-record: false

      - name: SBOM for amd64 (SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.amd64.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom-amd64.spdx.json
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.54.0

      - name: SBOM for arm64 (SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.arm64.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom-arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.54.0

      # actions/attest directly: actions/attest-sbom is deprecated in its
      # favour and only wraps it.
      - name: Attest the amd64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.amd64.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom-amd64.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest the arm64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.arm64.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom-arm64.spdx.json
          push-to-registry: true
          create-storage-record: false
