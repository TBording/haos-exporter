# Dependency review: fails a pull request that adds a dependency with a known
# vulnerability of high severity or worse.
#
# - Trigger: pull_request only. Never pull_request_target.
# - Read-only token; the action does not comment on the pull request.

name: Dependency review

on:
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request replaces a running review.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
